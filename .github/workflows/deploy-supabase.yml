name: Deploy Supabase Production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Apply migrations and deploy Edge Functions
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      GATEOPS_INTERNAL_SECRET: ${{ secrets.GATEOPS_INTERNAL_SECRET }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF SUPABASE_DB_PASSWORD GATEOPS_INTERNAL_SECRET; do
            if [[ -z "${!name}" ]]; then
              echo "::error::GitHub Actions secret $name belum dikonfigurasi."
              exit 1
            fi
          done

      - name: Link production project
        shell: bash
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Configure Edge Functions internal secret
        shell: bash
        run: supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" "GATEOPS_INTERNAL_SECRET=$GATEOPS_INTERNAL_SECRET"

      - name: Apply database migrations
        shell: bash
        run: supabase db push --linked

      - name: Deploy Edge Functions
        shell: bash
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
